<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Calibri', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #e8eaf0 0%, #d0d4dc 100%);
      padding: 20px;
    }

    /* ===== CALCULATOR CONTAINER ===== */
    .calculator {
      width: 100%;
      max-width: 380px;
      background: #1a1d23;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
    }

    .calculator:hover {
      transform: translateY(-2px);
    }

    /* ===== DISPLAY AREA ===== */
    .display {
      background: #0f1115;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .display .expression {
      font-size: 18px;
      color: #8a8d95;
      min-height: 28px;
      word-break: break-all;
      text-align: right;
      width: 100%;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .display .result {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
      min-height: 52px;
      word-break: break-all;
      text-align: right;
      width: 100%;
      transition: color 0.2s;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    .display .result.error {
      color: #ff555f;
      font-size: 28px;
    }

    /* ===== BUTTON GRID ===== */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px 8px;
      font-size: 22px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Segoe UI', 'Calibri', Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.92);
    }

    /* ===== BUTTON VARIANTS ===== */
    .btn-number {
      background: #2c2f36;
      color: #ffffff;
    }
    .btn-number:hover {
      background: #3a3d45;
    }

    .btn-operator {
      background: #ffad28;
      color: #1a1d23;
    }
    .btn-operator:hover {
      background: #ffb942;
    }

    .btn-equals {
      background: #ff555f;
      color: #ffffff;
    }
    .btn-equals:hover {
      background: #ff6a73;
    }

    .btn-clear {
      background: #444744;
      color: #ffffff;
    }
    .btn-clear:hover {
      background: #555855;
    }

    .btn-function {
      background: #2c2f36;
      color: #8a8d95;
    }
    .btn-function:hover {
      background: #3a3d45;
      color: #ffffff;
    }

    /* Span 2 columns */
    .span-2 {
      grid-column: span 2;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 420px) {
      .calculator {
        max-width: 100%;
        padding: 16px;
        border-radius: 18px;
      }
      .buttons {
        gap: 8px;
      }
      button {
        padding: 14px 6px;
        font-size: 18px;
        border-radius: 12px;
      }
      .display .result {
        font-size: 32px;
      }
      .display .expression {
        font-size: 15px;
      }
    }

    @media (max-width: 320px) {
      button {
        padding: 10px 4px;
        font-size: 15px;
        border-radius: 10px;
      }
      .display .result {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Calculator">
    <!-- DISPLAY -->
    <div class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expressionDisplay" aria-label="Expression"></div>
      <div class="result" id="resultDisplay" aria-label="Result">0</div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons" role="group" aria-label="Calculator buttons">
      <!-- Row 1: Clear functions -->
      <button class="btn-clear" data-action="clear" aria-label="Clear all">AC</button>
      <button class="btn-clear" data-action="backspace" aria-label="Backspace">&larr;</button>
      <button class="btn-function" data-action="percent" aria-label="Percent">%</button>
      <button class="btn-operator" data-action="operator" data-value="/" aria-label="Divide">&divide;</button>

      <!-- Row 2: 7 8 9 x -->
      <button class="btn-number" data-action="number" data-value="7" aria-label="7">7</button>
      <button class="btn-number" data-action="number" data-value="8" aria-label="8">8</button>
      <button class="btn-number" data-action="number" data-value="9" aria-label="9">9</button>
      <button class="btn-operator" data-action="operator" data-value="*" aria-label="Multiply">&times;</button>

      <!-- Row 3: 4 5 6 - -->
      <button class="btn-number" data-action="number" data-value="4" aria-label="4">4</button>
      <button class="btn-number" data-action="number" data-value="5" aria-label="5">5</button>
      <button class="btn-number" data-action="number" data-value="6" aria-label="6">6</button>
      <button class="btn-operator" data-action="operator" data-value="-" aria-label="Subtract">&minus;</button>

      <!-- Row 4: 1 2 3 + -->
      <button class="btn-number" data-action="number" data-value="1" aria-label="1">1</button>
      <button class="btn-number" data-action="number" data-value="2" aria-label="2">2</button>
      <button class="btn-number" data-action="number" data-value="3" aria-label="3">3</button>
      <button class="btn-operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <!-- Row 5: 0 . = -->
      <button class="btn-number span-2" data-action="number" data-value="0" aria-label="0">0</button>
      <button class="btn-number" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </div>

  <script>
    // ================================================================
    // SIMPLE HTML CALCULATOR — Application Logic
    // ================================================================

    /**
     * Calculator state — all application state is managed here.
     * @typedef {Object} CalcState
     * @property {string} currentExpr  - The current mathematical expression being built
     * @property {string} displayValue - The value shown on the display
     * @property {string} lastResult   - The last successfully computed result
     * @property {boolean} hasError    - Whether the calculator is in an error state
     * @property {boolean} freshResult - Whether the last button press produced a result
     */

    /** @type {CalcState} */
    const state = {
      currentExpr: '',
      displayValue: '0',
      hasError: false,
      freshResult: false,
    };

    // DOM references
    const expressionDisplay = document.getElementById('expressionDisplay');
    const resultDisplay = document.getElementById('resultDisplay');

    // ================================================================
    // DISPLAY MANAGER — Updates the UI to reflect current state
    // ================================================================

    /** Update both the expression and result display elements. */
    function updateDisplay() {
      expressionDisplay.textContent = state.currentExpr || '\u00A0';
      resultDisplay.textContent = state.displayValue;
      resultDisplay.classList.toggle('error', state.hasError);
    }

    /** Clear the display to initial state. */
    function clearDisplay() {
      state.currentExpr = '';
      state.displayValue = '0';
      state.hasError = false;
      state.freshResult = false;
      updateDisplay();
    }

    // ================================================================
    // EXPRESSION BUILDER — Constructs the expression from user input
    // ================================================================

    /**
     * Append a digit to the current expression.
     * @param {string} digit - A single digit character ("0"-"9")
     */
    function appendDigit(digit) {
      if (state.hasError) return;
      // If a fresh result was shown, start a new calculation
      if (state.freshResult) {
        state.currentExpr = '';
        state.freshResult = false;
      }
      state.currentExpr += digit;
      state.displayValue = state.currentExpr;
      updateDisplay();
    }

    /**
     * Append an operator to the expression.
     * Handles consecutive operator replacement.
     * @param {string} op - The operator character ("+", "-", "*", "/")
     */
    function appendOperator(op) {
      if (state.hasError) return;
      state.freshResult = false;

      // If the expression is empty, start with a negative number
      if (state.currentExpr === '' && op === '-') {
        state.currentExpr = '-';
        state.displayValue = '-';
        updateDisplay();
        return;
      }

      // If the expression is empty and it's not a minus, ignore
      if (state.currentExpr === '') return;

      // Replace trailing operator
      const lastChar = state.currentExpr.slice(-1);
      if ('+-*/'.includes(lastChar)) {
        state.currentExpr = state.currentExpr.slice(0, -1);
      }

      state.currentExpr += op;
      state.displayValue = state.currentExpr;
      updateDisplay();
    }

    /**
     * Append a decimal point to the current number.
     * Prevents duplicate decimals within the same number.
     */
    function appendDecimal() {
      if (state.hasError) return;
      if (state.freshResult) {
        state.currentExpr = '0';
        state.freshResult = false;
      }

      // Find the last number in the expression
      const parts = state.currentExpr.split(/[\+\-\*\/]/);
      const lastNum = parts[parts.length - 1];

      // Prevent multiple decimals in the same number
      if (lastNum.includes('.')) return;

      state.currentExpr += '.';
      state.displayValue = state.currentExpr;
      updateDisplay();
    }

    // ================================================================
    // EXPRESSION EVALUATOR — Safe arithmetic parser (no Function() constructor)
    // Uses a tokenizer and recursive descent parser for safe evaluation.
    // ================================================================

    /**
     * Tokenize an arithmetic expression into numbers and operators.
     * @param {string} expr - The expression string to tokenize
     * @returns {Array<{type: string, value: string|number}>} Array of tokens
     */
    function tokenize(expr) {
      const tokens = [];
      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/[\d\.]/.test(ch)) {
          let num = '';
          while (i < expr.length && /[\d\.]/.test(expr[i])) {
            num += expr[i];
            i++;
          }
          // Validate number format
          if ((num.match(/\./g) || []).length > 1) {
            throw new Error('Invalid number format');
          }
          tokens.push({ type: 'number', value: parseFloat(num) });
          continue;
        }
        if ('+-*/'.includes(ch)) {
          tokens.push({ type: 'operator', value: ch });
          i++;
          continue;
        }
        // Invalid character
        throw new Error('Invalid character in expression');
      }
      return tokens;
    }

    /**
     * Parse a list of tokens into a result using operator precedence.
     * Handles +, -, *, / with correct precedence (multiplication/division before addition/subtraction).
     * @param {Array} tokens - Token array from tokenize()
     * @returns {number} The computed result
     */
    function parse(tokens) {
      if (tokens.length === 0) throw new Error('Empty expression');

      // Handle leading minus for negative numbers
      if (tokens[0].type === 'operator' && tokens[0].value === '-') {
        if (tokens.length < 2 || tokens[1].type !== 'number') {
          throw new Error('Invalid negative number');
        }
        tokens = [{ type: 'number', value: -tokens[1].value }, ...tokens.slice(2)];
      }

      // First pass: handle multiplication and division
      const pass1 = [tokens[0]];
      for (let i = 1; i < tokens.length; i += 2) {
        const op = tokens[i];
        const right = tokens[i + 1];
        if (!right || right.type !== 'number') throw new Error('Invalid expression');
        
        let num = right.value;
        // Handle negative right operand
        if (right.value < 0) { num = right.value; }

        if (op.value === '*') {
          const left = pass1.pop();
          if (!left || left.type !== 'number') throw new Error('Invalid expression');
          pass1.push({ type: 'number', value: left.value * num });
        } else if (op.value === '/') {
          if (num === 0) throw new Error('Cannot divide by zero');
          const left = pass1.pop();
          if (!left || left.type !== 'number') throw new Error('Invalid expression');
          pass1.push({ type: 'number', value: left.value / num });
        } else {
          // Preserve operator and number for pass 2
          pass1.push(op, { type: 'number', value: num });
        }
      }

      // Second pass: handle addition and subtraction
      let result = pass1[0].value;
      for (let i = 1; i < pass1.length; i += 2) {
        const op = pass1[i];
        const right = pass1[i + 1];
        if (!right || right.type !== 'number') throw new Error('Invalid expression');
        if (op.value === '+') result += right.value;
        else if (op.value === '-') result -= right.value;
      }

      return result;
    }

    /**
     * Evaluate the current expression safely using a tokenizer and operator-precedence parser.
     * SECURITY FIX [S-001]: Replaced Function() constructor with recursive descent parser.
     */
    function evaluate() {
      if (state.hasError) return;

      const expr = state.currentExpr;
      if (!expr || expr.trim() === '') return;

      try {
        const tokens = tokenize(expr);
        const result = parse(tokens);

        if (!isFinite(result)) {
          showError('Cannot divide by zero');
          return;
        }

        const formatted = formatResult(result);
        state.displayValue = formatted;
        state.currentExpr = String(formatted);
        state.freshResult = true;
        updateDisplay();
      } catch (err) {
        showError(err.message || 'Syntax error');
      }
    }

    /**
     * Format a numeric result for display.
     * Avoids floating-point display issues (e.g., 0.1 + 0.2 = 0.30000000000000004).
     * @param {number} num - The number to format
     * @returns {string} The formatted number string
     */
    function formatResult(num) {
      if (!Number.isInteger(num)) {
        // If the number has more than 10 significant digits, format with toPrecision
        const str = String(num);
        if (str.length > 15) {
          return num.toPrecision(10);
        }
        // Round to 10 decimal places max to avoid floating point issues
        return parseFloat(num.toFixed(10)).toString();
      }
      // For large integers, use toPrecision to avoid scientific notation
      if (Math.abs(num) > 9999999999) {
        return num.toPrecision(10);
      }
      return num.toString();
    }

    /**
     * Show an error message on the display.
     * @param {string} message - The error message to display
     */
    function showError(message) {
      state.hasError = true;
      state.displayValue = message;
      updateDisplay();
    }

    // ================================================================
    // PERCENTAGE — Calculate percentage of current expression
    // ================================================================

    /** Convert the current expression to a percentage. */
    function percent() {
      if (state.hasError) return;
      if (!state.currentExpr) return;
      const val = parseFloat(state.currentExpr);
      if (isNaN(val)) return;
      const result = val / 100;
      state.currentExpr = String(result);
      state.displayValue = String(result);
      state.freshResult = true;
      updateDisplay();
    }

    // ================================================================
    // BACKSPACE — Remove the last character
    // ================================================================

    /** Remove the last character from the expression. */
    function backspace() {
      if (state.hasError) {
        clearDisplay();
        return;
      }
      if (state.freshResult) {
        clearDisplay();
        return;
      }
      state.currentExpr = state.currentExpr.slice(0, -1);
      state.displayValue = state.currentExpr || '0';
      updateDisplay();
    }

    // ================================================================
    // EVENT HANDLER — Processes button clicks and keyboard events
    // ================================================================

    /**
     * Handle a click on any calculator button.
     * @param {MouseEvent} event - The click event
     */
    function handleButtonClick(event) {
      const button = event.currentTarget;
      const action = button.getAttribute('data-action');
      const value = button.getAttribute('data-value');

      switch (action) {
        case 'number':
          appendDigit(value);
          break;
        case 'operator':
          appendOperator(value);
          break;
        case 'decimal':
          appendDecimal();
          break;
        case 'equals':
          evaluate();
          break;
        case 'clear':
          clearDisplay();
          break;
        case 'backspace':
          backspace();
          break;
        case 'percent':
          percent();
          break;
        default:
          break;
      }
    }

    /**
     * Handle keyboard input mapped to calculator actions.
     * @param {KeyboardEvent} event - The keyboard event
     */
    function handleKeyboard(event) {
      const key = event.key;

      // Number keys 0-9
      if (/^[0-9]$/.test(key)) {
        event.preventDefault();
        appendDigit(key);
        return;
      }

      // Operator keys
      if (key === '+') {
        event.preventDefault();
        appendOperator('+');
        return;
      }
      if (key === '-') {
        event.preventDefault();
        appendOperator('-');
        return;
      }
      if (key === '*') {
        event.preventDefault();
        appendOperator('*');
        return;
      }
      if (key === '/') {
        event.preventDefault();
        appendOperator('/');
        return;
      }

      // Decimal point
      if (key === '.') {
        event.preventDefault();
        appendDecimal();
        return;
      }

      // Equals / Enter
      if (key === '=' || key === 'Enter') {
        event.preventDefault();
        evaluate();
        return;
      }

      // Clear / Escape
      if (key === 'Escape') {
        event.preventDefault();
        clearDisplay();
        return;
      }

      // Backspace
      if (key === 'Backspace') {
        event.preventDefault();
        backspace();
        return;
      }

      // Percent
      if (key === '%') {
        event.preventDefault();
        percent();
        return;
      }
    }

    // ================================================================
    // EVENT BINDING — Attach event listeners to all buttons and keyboard
    // ================================================================

    // Bind click events to all calculator buttons
    document.querySelectorAll('.buttons button').forEach(button => {
      button.addEventListener('click', handleButtonClick);
    });

    // Bind keyboard events to the document
    document.addEventListener('keydown', handleKeyboard);

    // Initial display update
    clearDisplay();
  </script>
</body>
</html>
